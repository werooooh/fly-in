[project]
name = "flyin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "romgutie", email = "romgutie@student.42nice.fr" }
]
requires-python = ">=3.10"
dependencies = [
    "colorama>=0.4.6",
    "pydantic>=2.13.4",
    "pygame>=2.6.1",
]

[project.scripts]
flyin = "flyin:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/flyin"]
