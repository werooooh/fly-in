[project]
name = "fly-in"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Romain Gutierrez", email = "gutierrez08rom@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "colorama>=0.4.6",
    "pydantic>=2.13.4",
    "pygame>=2.6.1",
]

[project.scripts]
fly-in = "fly_in:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
]
